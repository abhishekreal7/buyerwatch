<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuyerWatch extension settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon-48.png" alt="" aria-hidden="true">
        <span>BuyerWatch</span>
      </div>
      <div class="eyebrow">Browser extension</div>
      <h1>Connection settings</h1>
      <p>Use the production URL normally. Switch to localhost only while developing BuyerWatch on this computer.</p>
      <form id="settings-form">
        <label for="app-url">BuyerWatch URL</label>
        <input id="app-url" type="url" placeholder="https://buyerwatch.co" required>
        <button type="submit">Save and test connection</button>
      </form>
      <p id="result" role="status"></p>
    </main>
    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
