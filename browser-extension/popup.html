<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuyerWatch</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand-row">
        <div class="brand">
          <img class="brand-mark" src="icons/icon-48.png" alt="" aria-hidden="true">
          <span>BuyerWatch</span>
        </div>
        <button id="settings-button" class="icon-button" type="button" aria-label="Extension settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </button>
      </header>

      <section id="loading-view" class="view centered">
        <span class="status-dot"></span>
        <p>Connecting to BuyerWatch</p>
      </section>

      <section id="login-view" class="view hidden">
        <div class="eyebrow">Connect your account</div>
        <h1>Capture Reddit conversations while you browse.</h1>
        <p class="muted">Use the same email and password as your BuyerWatch account.</p>
        <form id="login-form">
          <label>
            Email
            <input id="email" name="email" type="email" autocomplete="email" required>
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button id="login-button" class="primary" type="submit">Connect BuyerWatch</button>
          <p id="login-status" class="status-message" role="status"></p>
        </form>
      </section>

      <section id="capture-view" class="view hidden">
        <div class="account-row">
          <div>
            <div class="eyebrow">Connected</div>
            <div id="account-email" class="account-email"></div>
          </div>
          <button id="logout-button" class="text-button" type="button">Sign out</button>
        </div>
        <div id="site-card" class="site-card">
          <div class="site-icon" id="site-icon">BW</div>
          <div>
            <div id="site-name" class="site-name">Open a Reddit conversation</div>
            <div id="site-detail" class="muted compact">BuyerWatch captures Reddit posts</div>
          </div>
        </div>
        <button id="capture-button" class="primary capture-button" type="button">
          Capture conversation
        </button>
        <p id="status-message" class="status-message" role="status"></p>
        <a class="privacy-link" href="https://buyerwatch.co/privacy" target="_blank" rel="noreferrer">
          Privacy and data use
        </a>
      </section>
    </main>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
