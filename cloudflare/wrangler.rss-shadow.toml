name = "buyerwatch-rss-shadow"
main = "rss-shadow-monitor.mjs"
compatibility_date = "2026-08-24"

[vars]
BUYERWATCH_APP_URL = "https://www.buyerwatch.co"

# Cloudflare is the production monitoring clock. Per-plan polling remains
# enforced inside BuyerWatch, so this 5-minute tick never grants a customer a
# faster cadence than their plan allows.
[triggers]
crons = ["*/5 * * * *"]
