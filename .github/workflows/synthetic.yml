name: Production synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL || 'https://buyerwatch.co' }}
        run: node scripts/smoke-production.mjs
